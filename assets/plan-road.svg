<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><title id="t">The plan: from today to less government</title><desc id="d">The plan: a road from today to less government in six steps. 1 Stop the harm. 2 Tear up the permission slips. 3 Open the exits. 4 Cap it and set a clock. 5 Push power down. 6 Hand it back. Then the road forks to a small state or no state.</desc><rect width="880" height="410" rx="18" fill="#1f2a44"/><g transform="translate(0 8)"><path d="M10 160 C 60 160, 100 100, 165 112 S 230 160, 260 150 S 320 100, 355 112 S 420 160, 450 150 S 520 100, 560 112 C 600 118, 610 120, 630 120" fill="none" stroke="#fffdf5" stroke-width="30" stroke-linecap="round"/><path d="M10 160 C 60 160, 100 100, 165 112 S 230 160, 260 150 S 320 100, 355 112 S 420 160, 450 150 S 520 100, 560 112 C 600 118, 610 120, 630 120" fill="none" stroke="#f5c400" stroke-width="3" stroke-dasharray="10 9"/><path d="M630 120 C 660 120, 670 70, 712 62" fill="none" stroke="#fffdf5" stroke-width="22" stroke-linecap="round"/><path d="M630 120 C 660 120, 670 170, 712 178" fill="none" stroke="#fffdf5" stroke-width="22" stroke-linecap="round"/><circle cx="68" cy="141" r="19" fill="#f5c400" stroke="#1a1a1a" stroke-width="3"/><text x="68" y="148" font-size="20" font-weight="800" text-anchor="middle" fill="#1a1a1a">1</text><circle cx="165" cy="112" r="19" fill="#f5c400" stroke="#1a1a1a" stroke-width="3"/><text x="165" y="119" font-size="20" font-weight="800" text-anchor="middle" fill="#1a1a1a">2</text><circle cx="260" cy="150" r="19" fill="#f5c400" stroke="#1a1a1a" stroke-width="3"/><text x="260" y="157" font-size="20" font-weight="800" text-anchor="middle" fill="#1a1a1a">3</text><circle cx="355" cy="112" r="19" fill="#f5c400" stroke="#1a1a1a" stroke-width="3"/><text x="355" y="119" font-size="20" font-weight="800" text-anchor="middle" fill="#1a1a1a">4</text><circle cx="450" cy="150" r="19" fill="#f5c400" stroke="#1a1a1a" stroke-width="3"/><text x="450" y="157" font-size="20" font-weight="800" text-anchor="middle" fill="#1a1a1a">5</text><circle cx="545" cy="112" r="19" fill="#f5c400" stroke="#1a1a1a" stroke-width="3"/><text x="545" y="119" font-size="20" font-weight="800" text-anchor="middle" fill="#1a1a1a">6</text><text x="14" y="206" font-size="20" font-weight="800" fill="#ffffff">Today</text><text x="726" y="58" font-size="20" font-weight="800" fill="#ffffff">A small state</text><text x="726" y="184" font-size="20" font-weight="800" fill="#ffffff">No state</text></g><circle cx="40" cy="261" r="15" fill="#f5c400" stroke="#1a1a1a" stroke-width="2"/><text x="40" y="268" font-size="17" font-weight="800" text-anchor="middle" fill="#1a1a1a">1</text><text x="66" y="268" font-size="20" font-weight="700" fill="#ffffff">Stop the harm</text><circle cx="40" cy="301" r="15" fill="#f5c400" stroke="#1a1a1a" stroke-width="2"/><text x="40" y="308" font-size="17" font-weight="800" text-anchor="middle" fill="#1a1a1a">2</text><text x="66" y="308" font-size="20" font-weight="700" fill="#ffffff">Tear up the permission slips</text><circle cx="40" cy="341" r="15" fill="#f5c400" stroke="#1a1a1a" stroke-width="2"/><text x="40" y="348" font-size="17" font-weight="800" text-anchor="middle" fill="#1a1a1a">3</text><text x="66" y="348" font-size="20" font-weight="700" fill="#ffffff">Open the exits</text><circle cx="460" cy="261" r="15" fill="#f5c400" stroke="#1a1a1a" stroke-width="2"/><text x="460" y="268" font-size="17" font-weight="800" text-anchor="middle" fill="#1a1a1a">4</text><text x="486" y="268" font-size="20" font-weight="700" fill="#ffffff">Cap it and set a clock</text><circle cx="460" cy="301" r="15" fill="#f5c400" stroke="#1a1a1a" stroke-width="2"/><text x="460" y="308" font-size="17" font-weight="800" text-anchor="middle" fill="#1a1a1a">5</text><text x="486" y="308" font-size="20" font-weight="700" fill="#ffffff">Push power down</text><circle cx="460" cy="341" r="15" fill="#f5c400" stroke="#1a1a1a" stroke-width="2"/><text x="460" y="348" font-size="17" font-weight="800" text-anchor="middle" fill="#1a1a1a">6</text><text x="486" y="348" font-size="20" font-weight="700" fill="#ffffff">Hand it back</text><text x="850" y="392" font-size="15" font-weight="700" text-anchor="end" fill="#f5c400">libertarianenough.org/plan</text></svg>
